<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BLS SPORT - Pengeluaran Barang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen p-2 sm:p-6">
    <div class="max-w-[1400px] mx-auto bg-white shadow-xl rounded-2xl overflow-hidden border border-gray-200">
        <!-- Header -->
        <div class="bg-gradient-to-r from-orange-600 to-amber-600 p-4 sm:p-6 text-white flex flex-col sm:flex-row justify-between items-center gap-4">
            <div>
                <h1 class="text-xl sm:text-2xl font-extrabold tracking-wide uppercase text-center sm:text-left">BLS SPORT PENGELUARAN BARANG</h1>
                <p class="text-orange-100 text-xs sm:text-sm mt-1 text-center sm:text-left">Rekapitulasi Harian Shopee & TikTok</p>
            </div>
            <div class="flex items-center gap-3 bg-white/10 p-3 rounded-xl backdrop-blur-md w-full sm:w-auto justify-between sm:justify-start">
                <div>
                    <label class="text-xs text-orange-200 block font-medium">Tarif / Paket (Rp)</label>
                    <input type="number" id="feePerPackage" value="500" class="w-28 bg-white text-gray-900 font-bold px-3 py-1 rounded-lg text-center outline-none focus:ring-2 focus:ring-orange-400" oninput="calculateAll()">
                </div>
                <button onclick="resetData()" class="bg-red-500 hover:bg-red-600 text-white px-3 py-2 rounded-lg text-xs font-semibold transition shadow h-fit">Reset</button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 p-4 bg-orange-50/50 border-b border-orange-100">
            <div class="bg-white p-3 rounded-xl shadow-sm border border-orange-200">
                <p class="text-[11px] text-gray-500 font-semibold uppercase">Total Shopee</p>
                <h3 id="totalShopee" class="text-xl font-bold text-orange-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-purple-200">
                <p class="text-[11px] text-gray-500 font-semibold uppercase">Total TikTok</p>
                <h3 id="totalTiktok" class="text-xl font-bold text-purple-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-emerald-200">
                <p class="text-[11px] text-gray-500 font-semibold uppercase">Keseluruhan Paket</p>
                <h3 id="totalAll" class="text-xl font-bold text-emerald-600 mt-1">0</h3>
            </div>
            <div class="bg-white p-3 rounded-xl shadow-sm border border-blue-200">
                <p class="text-[11px] text-gray-500 font-semibold uppercase">Total Pendapatan</p>
                <h3 id="totalEarnings" class="text-xl font-bold text-blue-600 mt-1">Rp 0</h3>
            </div>
        </div>

        <!-- Main Tables Container (Side by Side, Scrollable on Mobile) -->
        <div class="p-4 overflow-x-auto">
            <div class="min-w-[900px] grid grid-cols-2 gap-6">
                
                <!-- SHOPEE TABLE -->
                <div class="rounded-xl border border-orange-300 shadow-sm overflow-hidden bg-white">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-[#ED7D31] text-white text-center">
                                <th colspan="4" class="py-2.5 px-3 text-base font-bold tracking-wider">SHOPPE</th>
                            </tr>
                            <tr class="bg-[#FCE4D6] text-gray-900 text-xs font-bold border-b border-orange-300 text-center">
                                <th class="py-2 px-2 border-r border-orange-300 w-1/4">HARI</th>
                                <th class="py-2 px-2 border-r border-orange-300 w-1/4">UKURAN</th>
                                <th class="py-2 px-2 border-r border-orange-300 w-1/4">JUMLAH</th>
                                <th class="py-2 px-2 w-1/4">TOTAL PAKET</th>
                            </tr>
                        </thead>
                        <tbody id="shopeeTableBody" class="text-xs">
                            <!-- JS Injection -->
                        </tbody>
                        <tfoot>
                            <tr class="bg-gray-200 font-bold text-gray-900 border-t-2 border-gray-400">
                                <td colspan="3" class="py-2.5 px-3 text-right">TOTAL</td>
                                <td id="shopeeFooterTotal" class="py-2.5 px-3 text-center text-orange-700 bg-orange-100 text-sm">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

                <!-- TIKTOK TABLE -->
                <div class="rounded-xl border border-purple-300 shadow-sm overflow-hidden bg-white">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-[#8B5CF6] text-white text-center">
                                <th colspan="4" class="py-2.5 px-3 text-base font-bold tracking-wider">TIKTOK</th>
                            </tr>
                            <tr class="bg-[#EDE9FE] text-gray-900 text-xs font-bold border-b border-purple-300 text-center">
                                <th class="py-2 px-2 border-r border-purple-300 w-1/4">HARI</th>
                                <th class="py-2 px-2 border-r border-purple-300 w-1/4">UKURAN</th>
                                <th class="py-2 px-2 border-r border-purple-300 w-1/4">JUMLAH</th>
                                <th class="py-2 px-2 w-1/4">TOTAL PAKET</th>
                            </tr>
                        </thead>
                        <tbody id="tiktokTableBody" class="text-xs">
                            <!-- JS Injection -->
                        </tbody>
                        <tfoot>
                            <tr class="bg-gray-200 font-bold text-gray-900 border-t-2 border-gray-400">
                                <td colspan="3" class="py-2.5 px-3 text-right">TOTAL</td>
                                <td id="tiktokFooterTotal" class="py-2.5 px-3 text-center text-purple-700 bg-purple-100 text-sm">0</td>
                            </tr>
                        </tfoot>
                    </table>
                </div>

            </div>
        </div>

        <!-- Footer Action -->
        <div class="bg-gray-50 px-6 py-3 border-t border-gray-200 flex justify-between items-center">
            <p class="text-xs text-gray-500">Data otomatis tersimpan di perangkat Anda.</p>
            <button onclick="exportData()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-semibold shadow transition">
                📥 Ekspor Data (TXT)
            </button>
        </div>
    </div>

    <script>
        const days = ['SENIN', 'SELASA', 'RABU', 'KAMIS', 'JUMAT', 'SABTU'];
        const sizes = ['M', 'L', 'JUMBO', 'TRAINING'];

        function initTables() {
            const shopeeBody = document.getElementById('shopeeTableBody');
            const tiktokBody = document.getElementById('tiktokTableBody');

            let shopeeHTML = '';
            let tiktokHTML = '';

            days.forEach((day, dayIndex) => {
                sizes.forEach((size, sizeIndex) => {
                    const rowBg = dayIndex % 2 === 0 ? 'bg-white' : 'bg-amber-50/20';
                    const tiktokRowBg = dayIndex % 2 === 0 ? 'bg-white' : 'bg-purple-50/20';
                    
                    // Shopee
                    shopeeHTML += `<tr class="${rowBg} border-b border-gray-200 text-center">`;
                    if (sizeIndex === 0) {
                        shopeeHTML += `<td rowspan="4" class="py-2 px-2 font-bold bg-amber-100/60 border-r border-orange-200 align-middle text-gray-800">${day}</td>`;
                    }
                    shopeeHTML += `<td class="py-2 px-2 border-r border-gray-200 font-medium text-gray-700 text-left pl-3">${size}</td>`;
                    shopeeHTML += `<td class="py-1.5 px-2 border-r border-gray-200">
                        <input type="number" min="0" data-type="jumlah" data-platform="shopee" data-day="${day}" data-size="${size}" 
                        class="w-full bg-orange-50/40 border border-orange-200 rounded px-2 py-1 text-center font-semibold text-gray-800 focus:bg-white focus:ring-1 focus:ring-orange-400 outline-none" 
                        oninput="calculateAll()">
                    </td>`;
                    if (sizeIndex === 0) {
                        shopeeHTML += `<td rowspan="4" class="py-2 px-2 bg-orange-50/70 border-l border-orange-200 align-middle">
                            <input type="number" min="0" data-type="totalpaket" data-platform="shopee" data-day="${day}" 
                            class="w-full bg-white border border-orange-300 rounded px-2 py-1.5 text-center font-bold text-orange-800 focus:ring-2 focus:ring-orange-500 outline-none" 
                            oninput="calculateAll()">
                        </td>`;
                    }
                    shopeeHTML += `</tr>`;

                    // TikTok
                    tiktokHTML += `<tr class="${tiktokRowBg} border-b border-gray-200 text-center">`;
                    if (sizeIndex === 0) {
                        tiktokHTML += `<td rowspan="4" class="py-2 px-2 font-bold bg-purple-100/60 border-r border-purple-200 align-middle text-gray-800">${day}</td>`;
                    }
                    tiktokHTML += `<td class="py-2 px-2 border-r border-gray-200 font-medium text-gray-700 text-left pl-3">${size}</td>`;
                    tiktokHTML += `<td class="py-1.5 px-2 border-r border-gray-200">
                        <input type="number" min="0" data-type="jumlah" data-platform="tiktok" data-day="${day}" data-size="${size}" 
                        class="w-full bg-purple-50/40 border border-purple-200 rounded px-2 py-1 text-center font-semibold text-gray-800 focus:bg-white focus:ring-1 focus:ring-purple-400 outline-none" 
                        oninput="calculateAll()">
                    </td>`;
                    if (sizeIndex === 0) {
                        tiktokHTML += `<td rowspan="4" class="py-2 px-2 bg-purple-50/70 border-l border-purple-200 align-middle">
                            <input type="number" min="0" data-type="totalpaket" data-platform="tiktok" data-day="${day}" 
                            class="w-full bg-white border border-purple-300 rounded px-2 py-1.5 text-center font-bold text-purple-800 focus:ring-2 focus:ring-purple-500 outline-none" 
                            oninput="calculateAll()">
                        </td>`;
                    }
                    tiktokHTML += `</tr>`;
                });
            });

            shopeeBody.innerHTML = shopeeHTML;
            tiktokBody.innerHTML = tiktokHTML;
            loadData();
        }

        function calculateAll() {
            let sumShopeeTotal = 0;
            let sumTiktokTotal = 0;
            const fee = parseFloat(document.getElementById('feePerPackage').value) || 0;
            const savedData = {};

            days.forEach(day => {
                // Shopee Total Paket input value
                const sTotalInput = document.querySelector(`input[data-type="totalpaket"][data-platform="shopee"][data-day="${day}"]`);
                const sVal = parseInt(sTotalInput.value) || 0;
                sumShopeeTotal += sVal;
                if (sTotalInput.value) savedData[`shopee_tot_${day}`] = sVal;

                sizes.forEach(size => {
                    const sInput = document.querySelector(`input[data-type="jumlah"][data-platform="shopee"][data-day="${day}"][data-size="${size}"]`);
                    if (sInput.value) savedData[`shopee_qty_${day}_${size}`] = sInput.value;
                });

                // TikTok Total Paket input value
                const tTotalInput = document.querySelector(`input[data-type="totalpaket"][data-platform="tiktok"][data-day="${day}"]`);
                const tVal = parseInt(tTotalInput.value) || 0;
                sumTiktokTotal += tVal;
                if (tTotalInput.value) savedData[`tiktok_tot_${day}`] = tVal;

                sizes.forEach(size => {
                    const tInput = document.querySelector(`input[data-type="jumlah"][data-platform="tiktok"][data-day="${day}"][data-size="${size}"]`);
                    if (tInput.value) savedData[`tiktok_qty_${day}_${size}`] = tInput.value;
                });
            });

            document.getElementById('shopeeFooterTotal').innerText = sumShopeeTotal;
            document.getElementById('tiktokFooterTotal').innerText = sumTiktokTotal;

            const grandTotal = sumShopeeTotal + sumTiktokTotal;
            document.getElementById('totalShopee').innerText = sumShopeeTotal;
            document.getElementById('totalTiktok').innerText = sumTiktokTotal;
            document.getElementById('totalAll').innerText = grandTotal;
            document.getElementById('totalEarnings').innerText = 'Rp ' + (grandTotal * fee).toLocaleString('id-ID');

            savedData['fee'] = fee;
            localStorage.setItem('bls_sport_data_v2', JSON.stringify(savedData));
        }

        function loadData() {
            const saved = localStorage.getItem('bls_sport_data_v2');
            if (!saved) return;
            try {
                const data = JSON.parse(saved);
                if (data.fee !== undefined) document.getElementById('feePerPackage').value = data.fee;

                for (const key in data) {
                    if (key === 'fee') continue;
                    const parts = key.split('_');
                    const platform = parts[0];
                    const type = parts[1]; // tot or qty
                    const day = parts[2];
                    
                    if (type === 'tot') {
                        const input = document.querySelector(`input[data-type="totalpaket"][data-platform="${platform}"][data-day="${day}"]`);
                        if (input) input.value = data[key];
                    } else if (type === 'qty') {
                        const size = parts[3];
                        const input = document.querySelector(`input[data-type="jumlah"][data-platform="${platform}"][data-day="${day}"][data-size="${size}"]`);
                        if (input) input.value = data[key];
                    }
                }
                calculateAll();
            } catch (e) { console.error(e); }
        }

        function resetData() {
            if (confirm("Reset semua data?")) {
                localStorage.removeItem('bls_sport_data_v2');
                document.querySelectorAll('input[type="number"]').forEach(input => {
                    if (input.id !== 'feePerPackage') input.value = '';
                });
                calculateAll();
            }
        }

        function exportData() {
            let text = "=== REKAP BLS SPORT ===\n\n";
            days.forEach(day => {
                const sTot = document.querySelector(`input[data-type="totalpaket"][data-platform="shopee"][data-day="${day}"]`).value || 0;
                const tTot = document.querySelector(`input[data-type="totalpaket"][data-platform="tiktok"][data-day="${day}"]`).value || 0;
                text += `${day} -> Shopee Total: ${sTot} | TikTok Total: ${tTot}\n`;
            });
            text += `\nTOTAL KESELURUHAN: ${document.getElementById('totalAll').innerText} paket\n`;
            text += `TOTAL PENDAPATAN: ${document.getElementById('totalEarnings').innerText}\n`;

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'Rekap_BLS_Sport.txt';
            a.click();
        }

        window.onload = initTables;
    </script>
</body>
</html>
